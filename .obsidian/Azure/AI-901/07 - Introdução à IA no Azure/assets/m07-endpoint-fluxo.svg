<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Chamada de um aplicativo a um endpoint de IA</title><desc id="desc">O cliente prepara uma solicitação autenticada por REST ou SDK; o endpoint recebe os dados, chama a implantação do modelo e devolve uma resposta para o cliente.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2878c8"/></marker></defs><rect width="1400" height="760" rx="28" fill="#f7f9fc"/><text x="65" y="78" font-family="Segoe UI,Arial" font-size="37" font-weight="700" fill="#17365d">Do aplicativo ao endpoint e de volta</text><text x="65" y="120" font-family="Segoe UI,Arial" font-size="21" fill="#51677e">REST e SDKs enviam solicitações; o serviço executa a inferência</text>
<rect x="75" y="250" width="230" height="155" rx="22" fill="#eaf3fb" stroke="#2878c8" stroke-width="3"/><text x="190" y="300" text-anchor="middle" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#17365d">Aplicativo</text><text x="190" y="337" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">captura entrada</text><text x="190" y="367" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">apresenta saída</text>
<path d="M310 325H420" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><text x="365" y="297" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#51677e">solicitação</text><rect x="440" y="215" width="260" height="220" rx="22" fill="#fff5df" stroke="#c99019" stroke-width="3"/><text x="570" y="263" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#765510">REST ou SDK</text><text x="570" y="303" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#6f654e">HTTP(S) · JSON</text><text x="570" y="335" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#6f654e">endpoint · modelo</text><text x="570" y="367" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#6f654e">entrada · cabeçalhos</text>
<path d="M705 325H810" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><text x="757" y="297" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#51677e">chamada autenticada</text><rect x="830" y="250" width="230" height="155" rx="22" fill="#f2edfa" stroke="#7754a8" stroke-width="3"/><text x="945" y="300" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#44306b">Endpoint</text><text x="945" y="337" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">recebe a chamada</text><text x="945" y="367" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">roteia à implantação</text>
<path d="M1065 325H1160" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><rect x="1180" y="250" width="170" height="155" rx="22" fill="#e8f5ef" stroke="#13846b" stroke-width="3"/><text x="1265" y="300" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#135e50">Modelo</text><text x="1265" y="337" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#315b57">inferência</text><text x="1265" y="367" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#315b57">gera a resposta</text>
<path d="M1265 420V520H190V415" fill="none" stroke="#13846b" stroke-width="4" marker-end="url(#a)"/><text x="720" y="505" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#135e50">resposta da API</text>
<rect x="235" y="570" width="400" height="105" rx="18" fill="#fff" stroke="#c99019" stroke-width="2"/><text x="435" y="611" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#765510">Identidade e credenciais</text><text x="435" y="643" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#6f654e">Entra ID / token ou chave protegida</text><path d="M570 438V550" stroke="#c99019" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#a)"/><text x="670" y="608" font-family="Segoe UI,Arial" font-size="16" fill="#6f654e">Não grave segredos no código.</text>
</svg>