<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc"><title id="title">Mapa visual do módulo 07</title><desc id="desc">O módulo parte dos conceitos de IA, passa pela infraestrutura do Azure, organiza recursos no Microsoft Foundry e termina com a integração por endpoint ao aplicativo.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2878c8"/></marker></defs><rect width="1500" height="720" rx="28" fill="#f7f9fc"/><text x="65" y="78" font-family="Segoe UI,Arial" font-size="37" font-weight="700" fill="#17365d">Percurso do módulo 07</text><text x="65" y="120" font-family="Segoe UI,Arial" font-size="21" fill="#51677e">Da ideia de IA até uma chamada de modelo feita pelo aplicativo</text>
