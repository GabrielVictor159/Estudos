<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
<title id="title">Arquitetura básica de um aplicativo de IA no Azure</title><desc id="desc">Usuário interage com cliente hospedado no Azure; o cliente usa identidade e rede para chamar um endpoint de IA. O modelo produz a resposta e a aplicação pode acessar armazenamento e telemetria.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2878c8"/></marker></defs><rect width="1500" height="850" rx="28" fill="#f7f9fc"/><text x="65" y="78" font-family="Segoe UI,Arial" font-size="37" font-weight="700" fill="#17365d">Peças de um aplicativo de IA no Azure</text><text x="65" y="120" font-family="Segoe UI,Arial" font-size="21" fill="#51677e">O modelo é uma parte da solução; aplicação, infraestrutura e controles completam o fluxo</text>
<rect x="60" y="185" width="1380" height="590" rx="28" fill="#fff" stroke="#8bb9df" stroke-width="3" stroke-dasharray="12 10"/><text x="90" y="225" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#2878c8">AMBIENTE DO AZURE</text>
<rect x="95" y="340" width="190" height="135" rx="20" fill="#eaf3fb" stroke="#2878c8" stroke-width="3"/><text x="190" y="385" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#17365d">Usuário</text><text x="190" y="420" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">entrada</text>
<path d="M290 407H355" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><rect x="375" y="310" width="250" height="195" rx="20" fill="#eaf3fb" stroke="#2878c8" stroke-width="3"/><text x="500" y="357" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#17365d">Aplicativo cliente</text><text x="500" y="397" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">interface · lógica</text><text x="500" y="427" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">prepara a solicitação</text><text x="500" y="457" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">apresenta a resposta</text>
<path d="M630 407H700" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><rect x="720" y="310" width="260" height="195" rx="20" fill="#fff5df" stroke="#c99019" stroke-width="3"/><text x="850" y="357" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#765510">Identidade e rede</text><text x="850" y="397" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#6f654e">Microsoft Entra ID</text><text x="850" y="427" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#6f654e">RBAC · conectividade</text><text x="850" y="457" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#6f654e">Key Vault para segredos</text>
<path d="M985 407H1050" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><rect x="1070" y="310" width="300" height="195" rx="20" fill="#f2edfa" stroke="#7754a8" stroke-width="3"/><text x="1220" y="357" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#44306b">Endpoint de IA</text><text x="1220" y="397" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">Microsoft Foundry</text><text x="1220" y="427" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">ou serviço de IA</text><text x="1220" y="457" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">modelo executa inferência</text>
<path d="M1220 510V585H500V515" fill="none" stroke="#13846b" stroke-width="4" marker-end="url(#a)"/><text x="850" y="575" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#135e50">Resposta da API retorna à aplicação</text>
<rect x="280" y="650" width="360" height="85" rx="16" fill="#e8f5ef" stroke="#13846b" stroke-width="2"/><text x="460" y="686" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#135e50">Armazenamento</text><text x="460" y="715" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#315b57">dados · estado · histórico</text><rect x="800" y="650" width="360" height="85" rx="16" fill="#e8f5ef" stroke="#13846b" stroke-width="2"/><text x="980" y="686" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#135e50">Operação</text><text x="980" y="715" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#315b57">logs · métricas · telemetria</text>
</svg>