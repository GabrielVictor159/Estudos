<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">Organização do Microsoft Foundry</title><desc id="desc">Dentro da assinatura e do grupo de recursos, o recurso do Foundry contém projetos. Um projeto reúne implantações de modelos, agentes, ferramentas e conexões de conhecimento. Portal e SDK permitem trabalhar com esses ativos.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2878c8"/></marker></defs><rect width="1400" height="850" rx="28" fill="#f7f9fc"/><text x="65" y="78" font-family="Segoe UI,Arial" font-size="37" font-weight="700" fill="#17365d">Como o Microsoft Foundry organiza uma solução</text><text x="65" y="120" font-family="Segoe UI,Arial" font-size="21" fill="#51677e">Recurso é a base no Azure; projeto organiza os ativos do caso de uso</text>
<rect x="65" y="165" width="1270" height="625" rx="28" fill="#fff" stroke="#8bb9df" stroke-width="3" stroke-dasharray="12 10"/><text x="95" y="205" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#2878c8">ASSINATURA E GRUPO DE RECURSOS DO AZURE</text>
<rect x="105" y="240" width="1190" height="485" rx="24" fill="#eaf3fb" stroke="#2878c8" stroke-width="3"/><text x="145" y="285" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#17365d">Recurso do Microsoft Foundry</text><text x="145" y="318" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">Plataforma, hospedagem e controles do Azure</text>
<rect x="155" y="355" width="820" height="310" rx="22" fill="#f2edfa" stroke="#7754a8" stroke-width="3"/><text x="195" y="400" font-family="Segoe UI,Arial" font-size="25" font-weight="700" fill="#44306b">Projeto da solução</text><text x="195" y="432" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">Espaço de trabalho que reúne os ativos usados no cenário</text>
<rect x="195" y="470" width="330" height="75" rx="15" fill="#fff" stroke="#9c84be" stroke-width="2"/><text x="220" y="500" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#44306b">Modelos</text><text x="220" y="527" font-family="Segoe UI,Arial" font-size="16" fill="#5d5270">catálogo · implantação · teste</text>
<rect x="565" y="470" width="360" height="75" rx="15" fill="#fff" stroke="#9c84be" stroke-width="2"/><text x="590" y="500" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#44306b">Agentes</text><text x="590" y="527" font-family="Segoe UI,Arial" font-size="16" fill="#5d5270">modelo · instruções · ferramentas</text>
<rect x="195" y="565" width="330" height="75" rx="15" fill="#fff" stroke="#9c84be" stroke-width="2"/><text x="220" y="595" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#44306b">Ferramentas</text><text x="220" y="622" font-family="Segoe UI,Arial" font-size="16" fill="#5d5270">capacidades e integrações</text>
<rect x="565" y="565" width="360" height="75" rx="15" fill="#fff" stroke="#9c84be" stroke-width="2"/><text x="590" y="595" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#44306b">Conhecimento</text><text x="590" y="622" font-family="Segoe UI,Arial" font-size="16" fill="#5d5270">fontes de dados e conexões</text>
<rect x="1015" y="355" width="230" height="145" rx="20" fill="#fff5df" stroke="#c99019" stroke-width="3"/><text x="1130" y="397" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#765510">Portal</text><text x="1130" y="431" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#6f654e">criar · explorar</text><text x="1130" y="458" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#6f654e">testar · gerenciar</text>
<rect x="1015" y="535" width="230" height="130" rx="20" fill="#e8f5ef" stroke="#13846b" stroke-width="3"/><text x="1130" y="577" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#135e50">SDK / API</text><text x="1130" y="611" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#315b57">integrar no aplicativo</text><text x="1130" y="638" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" fill="#315b57">acessar endpoints</text>
<path d="M975 430H1000" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><path d="M975 600H1000" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><text x="105" y="765" font-family="Segoe UI,Arial" font-size="18" font-weight="600" fill="#51677e">Um recurso pode conter vários projetos; cada projeto representa um espaço de trabalho para uma solução.</text>
