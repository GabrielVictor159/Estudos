<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Treinamento e inferência</title><desc id="desc">O treinamento usa exemplos para produzir um modelo treinado; a inferência usa esse modelo para processar novas entradas e gerar saídas.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2878c8"/></marker></defs>
<rect width="1400" height="760" rx="28" fill="#f7f9fc"/><text x="70" y="82" font-family="Segoe UI,Arial" font-size="38" font-weight="700" fill="#17365d">Do treinamento à inferência</text><text x="70" y="125" font-family="Segoe UI,Arial" font-size="22" fill="#51677e">O modelo aprende antes de ser usado pelo aplicativo</text>
<rect x="70" y="185" width="560" height="470" rx="24" fill="#eaf3fb" stroke="#2878c8" stroke-width="3"/><text x="105" y="235" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#17365d">1 · Treinamento</text>
<rect x="110" y="280" width="190" height="100" rx="16" fill="#fff" stroke="#8bb9df" stroke-width="2"/><text x="205" y="321" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="600" fill="#17365d">Dados de</text><text x="205" y="351" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#17365d">exemplo</text>
<path d="M310 330H380" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><rect x="400" y="280" width="185" height="100" rx="16" fill="#fff" stroke="#8bb9df" stroke-width="2"/><text x="492" y="321" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="600" fill="#17365d">Algoritmo</text><text x="492" y="351" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#17365d">de aprendizado</text>
<path d="M492 388V440" stroke="#2878c8" stroke-width="4" marker-end="url(#a)"/><rect x="175" y="460" width="350" height="105" rx="18" fill="#e8f5ef" stroke="#13846b" stroke-width="3"/><text x="350" y="503" text-anchor="middle" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#135e50">Modelo treinado</text><text x="350" y="535" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" fill="#315b57">parâmetros ajustados</text><text x="105" y="615" font-family="Segoe UI,Arial" font-size="18" fill="#51677e">Processo de preparação; não ocorre a cada pergunta.</text>
<rect x="770" y="185" width="560" height="470" rx="24" fill="#f2edfa" stroke="#7754a8" stroke-width="3"/><text x="805" y="235" font-family="Segoe UI,Arial" font-size="27" font-weight="700" fill="#44306b">2 · Inferência</text><rect x="820" y="300" width="180" height="95" rx="16" fill="#fff" stroke="#aa94ca" stroke-width="2"/><text x="910" y="340" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="600" fill="#44306b">Nova</text><text x="910" y="370" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" fill="#44306b">entrada</text><path d="M1010 347H1082" stroke="#7754a8" stroke-width="4" marker-end="url(#a)"/><rect x="1100" y="300" width="180" height="95" rx="16" fill="#fff" stroke="#aa94ca" stroke-width="2"/><text x="1190" y="340" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" font-weight="600" fill="#44306b">Modelo</text><text x="1190" y="370" text-anchor="middle" font-family="Segoe UI,Arial" font-size="21" fill="#44306b">treinado</text><path d="M1190 405V462" stroke="#7754a8" stroke-width="4" marker-end="url(#a)"/><rect x="880" y="480" width="360" height="95" rx="18" fill="#fff" stroke="#aa94ca" stroke-width="2"/><text x="1060" y="520" text-anchor="middle" font-family="Segoe UI,Arial" font-size="23" font-weight="700" fill="#44306b">Saída do modelo</text><text x="1060" y="550" text-anchor="middle" font-family="Segoe UI,Arial" font-size="19" fill="#5d5270">previsão · classificação · conteúdo</text><text x="805" y="615" font-family="Segoe UI,Arial" font-size="18" fill="#5d5270">O aplicativo envia entradas e consome resultados.</text>
</svg>